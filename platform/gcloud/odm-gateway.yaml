# Gateway API descriptor for GKE native Gateway Controller with End-to-End TLS
# Target release: myodmsample
# Requires: gcloud container clusters update CLUSTER_NAME --gateway-api=standard

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: myodmsample-odm-gateway
spec:
  # Use GKE's native Gateway Controller
  # Options: gke-l7-global-external-managed, gke-l7-regional-external-managed, gke-l7-rilb
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "mynicecompany.com"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: mynicecompany-tls-secret
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myodmsample-odm-httproute
spec:
  parentRefs:
  - name: myodmsample-odm-gateway
  rules:
  # Decision Server Console - /res
  - matches:
    - path:
        type: PathPrefix
        value: /res
    backendRefs:
    - name: myodmsample-odm-decisionserverconsole
      port: 443
      weight: 1
  
  # Decision Center - /decisioncenter
  - matches:
    - path:
        type: PathPrefix
        value: /decisioncenter
    backendRefs:
    - name: myodmsample-odm-decisioncenter
      port: 443
      weight: 1
  
  # Decision Center API - /decisioncenter-api
  - matches:
    - path:
        type: PathPrefix
        value: /decisioncenter-api
    backendRefs:
    - name: myodmsample-odm-decisioncenter
      port: 443
      weight: 1
  
  # Decision Server Runtime - /DecisionService
  - matches:
    - path:
        type: PathPrefix
        value: /DecisionService
    backendRefs:
    - name: myodmsample-odm-decisionserverruntime
      port: 443
      weight: 1
  
  # Decision Runner - /DecisionRunner
  - matches:
    - path:
        type: PathPrefix
        value: /DecisionRunner
    backendRefs:
    - name: myodmsample-odm-decisionrunner
      port: 443
      weight: 1

  # Decision MCP Server - /mcp/decision
  - matches:
    - path:
        type: PathPrefix
        value: /mcp/decision
    backendRefs:
    - name: myodmsample-odm-decisionmcpserver
      port: 443
      weight: 1

  # Management MCP Server - /mcp/management
  - matches:
    - path:
        type: PathPrefix
        value: /mcp/management
    backendRefs:
    - name: myodmsample-odm-managementmcpserver
      port: 443
      weight: 1

---
# HTTPS Health checks — GKE requires correct health checks on secure target ports
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: odm-decisioncenter-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 9453
        requestPath: /decisioncenter/healthCheck
  targetRef:
    group: ""
    kind: Service
    name: myodmsample-odm-decisioncenter

---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: odm-decisionserverconsole-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 9443
        requestPath: /res/login.jsp
  targetRef:
    group: ""
    kind: Service
    name: myodmsample-odm-decisionserverconsole

---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: odm-decisionserverruntime-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 9443
        requestPath: /DecisionService/
  targetRef:
    group: ""
    kind: Service
    name: myodmsample-odm-decisionserverruntime

---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: odm-decisionrunner-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 9443
        requestPath: /DecisionRunner/
  targetRef:
    group: ""
    kind: Service
    name: myodmsample-odm-decisionrunner

---
# MCP servers listen on container port 3000 (TLS enabled)
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: odm-decisionmcpserver-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 3000
        requestPath: /mcp/decision/healthcheck
  targetRef:
    group: ""
    kind: Service
    name: myodmsample-odm-decisionmcpserver

---
# NOTE: without a token, /mcp/management answers 401 (200-401 accepted on other platforms),
# but a GKE health check only treats 200 as healthy.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: odm-managementmcpserver-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 3000
        requestPath: /mcp/management/healthcheck
  targetRef:
    group: ""
    kind: Service
    name: myodmsample-odm-managementmcpserver

---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: dc-backend-service-policy
spec:
  targetRef:
    group: ""
    kind: Service
    name: myodmsample-odm-decisioncenter
  default:
    sessionAffinity:
      type: GENERATED_COOKIE
