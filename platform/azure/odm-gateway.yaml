# https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/api-specification-kubernetes#alb.networking.azure.io/v1.BackendTLSPolicy
apiVersion: alb.networking.azure.io/v1
kind: BackendTLSPolicy
metadata:
  name: ${HELM_RELEASE}-odm-decisioncenter-tls-policy
  namespace: ${NAMESPACE}
spec:
  targetRef:
    group: ""
    kind: Service
    name: ${HELM_RELEASE}-odm-decisioncenter
    namespace: ${NAMESPACE}
  default:
    sni: ${HELM_RELEASE}-odm-decisioncenter.${NAMESPACE}.svc.cluster.local
    ports:
